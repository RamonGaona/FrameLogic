services:
  postgres:
    image: postgres:16
    container_name: framelogic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: framelogic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno local}
      POSTGRES_DB: framelogic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
