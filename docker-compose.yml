services:
  postgres:
    image: postgres:16
    container_name: framelogic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: framelogic
      POSTGRES_PASSWORD: framelogic
      POSTGRES_DB: framelogic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
