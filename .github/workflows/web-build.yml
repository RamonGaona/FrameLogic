name: Web build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @rolldown/binding-linux-x64-gnu@1.2.8

      - name: Typecheck
        run: npm run typecheck

      - name: Automation and MCP integration tests
        run: npm run test:automation

      - name: Local browser chat parser tests
        run: npm run test:browser-chat

      - name: Domain and geometry tests
        run: npm test

      - name: Automatic drawing planner tests
        run: npm run test:drawings

      - name: Gizmo interaction tests
        run: npm run test:gizmos

      - name: Camera mouse navigation tests
        run: npm run test:camera

      - name: Instance tree layout tests
        run: npm run test:instance-tree

      - name: Piece preparation conversion tests
        run: npm run test:piece-preparation

      - name: Piece visualization tests
        run: npm run test:piece-visuals

      - name: Build FrameLogic web for Cloudflare
        run: npm run build:cloudflare

      - name: Verify static output
        run: |
          test -d apps/web/dist
          find apps/web/dist -maxdepth 3 -type f | sort

      - name: Verify Cloudflare Pages asset size limit
        run: |
          oversized="$(find apps/web/dist -type f -size +25M -print)"
          if [ -n "$oversized" ]; then
            echo "Cloudflare Pages rejects individual files larger than 25 MiB:"
            echo "$oversized"
            exit 1
          fi

      - name: Verify OpenCascade full WASM is externalized
        run: |
          if find apps/web/dist -type f -name 'opencascade.full*.wasm' | grep -q .; then
            echo "opencascade.full.wasm must not be bundled into the Cloudflare Pages output."
            exit 1
          fi

      - name: Verify remaining WASM assets
        run: |
          find apps/web/dist -type f -name '*.wasm' | grep -q .

