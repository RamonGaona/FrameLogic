name: Web build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native bundler bindings
        run: npm install --no-save --package-lock=false @rolldown/binding-linux-x64-gnu@1.2.8 lightningcss-linux-x64-gnu@1.33.0

      - name: Build web for Cloudflare
        run: npm run build

      - name: Verify static output
        run: |
          test -d apps/web/dist
          find apps/web/dist -maxdepth 3 -type f | sort

      - name: Verify Cloudflare Pages asset size limit
        run: |
          oversized="$(find apps/web/dist -type f -size +25M -print)"
          if [ -n "$oversized" ]; then
            echo "Cloudflare Pages rejects individual files larger than 25 MiB:"
            echo "$oversized"
            exit 1
          fi

      - name: Verify DWG converter glue and binary are deployed
        run: |
          test -s apps/web/dist/assets/wasm/dwgdxf.js
          test -s apps/web/dist/assets/wasm/dwgdxf_bg.wasm
          echo "DWG runtime assets packaged successfully."

      - name: Verify OpenCascade full WASM is externalized
        run: |
          if find apps/web/dist -type f -name 'opencascade.full*.wasm' | grep -q .; then
            echo "opencascade.full.wasm must not be bundled into the Cloudflare Pages output."
            exit 1
          fi

      - name: Verify remaining WASM assets
        run: |
          find apps/web/dist -type f -name '*.wasm' | grep -q .

