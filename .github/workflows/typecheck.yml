name: Validate

on:
  push:
    branches:
      - main
      - feature/precision-model-space
      - feature/precision-model-space-docs2
      - feature/lightweight-piece-representations
      - feature/reliable-3d-gizmos
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Linux native bindings
        run: npm install --no-save --package-lock=false @rolldown/binding-linux-x64-gnu@1.2.8 lightningcss-linux-x64-gnu@1.33.0

      - name: Typecheck
        run: npm run typecheck

      - name: Automation and MCP integration tests
        run: npm run test:automation

      - name: MCP deployment impact regression
        run: node --test scripts/ci/mcp-deployment-impact.test.mjs

      - name: Local browser chat parser tests
        run: npm run test:browser-chat

      - name: Domain and geometry tests
        run: npm test

      - name: Exact STEP geometric snapping regression
        run: npm run test:geometric-snaps

      - name: Precision and adaptive visualization tests
        run: npm run test:precision-stage2

      - name: Automatic drawing planner tests
        run: npm run test:drawings

      - name: Locked DWG/DXF .flproject restore regression
        run: npm run test:project-locked-dwg

      - name: Gizmo interaction tests
        run: npm run test:gizmos

      - name: Instance tree layout tests
        run: npm run test:instance-tree

      - name: Verify build version badge stays synchronized
        run: npm run test:version-badge

      - name: Hierarchical assembly and CAD history regression
        run: npm run test:assembly-hierarchy

      - name: Assembly Ctrl-gizmo and COPY by base/destination points
        run: npm run test:copybase

      - name: Model-space visibility and section group tests
        run: npm run test:visibility

      - name: Piece preparation conversion tests
        run: npm run test:piece-preparation

      - name: Camera mouse navigation tests
        run: npm run test:camera

      - name: Piece visualization tests
        run: npm run test:piece-visuals

      - name: DWG block/color import and millimetre regression
        run: npm run test:dwg-import

      - name: Cota DWG/DXF compact reference and SNAP regression
        run: npm run test:cota-cad

      - name: Dual DWG reader recovery regression
        run: npm run test:dwg-recovery

      - name: DWG runtime asset copy regression
        run: npm run test:dwg

      - name: Clash Detection regression tests
        run: npm run test:clash

      - name: OpenCascade B-rep boolean smoke test (Node)
        run: npm run test:clash:occt


