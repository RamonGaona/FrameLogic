name: Validate

on:
  push:
    branches:
      - main
      - feature/precision-model-space
      - feature/precision-model-space-docs2
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm install

      - name: Install Linux native bindings
        run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.2.8 lightningcss-linux-x64-gnu@1.33.0

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build
